[package]
name = "textgres"
version = "0.1.0"
edition = "2024"
description = "A PostgreSQL exploration TUI"
license = "GPL-3.0-only"

[[bin]]
# Keep the project name while exposing a compact terminal command.
name = "tg"
path = "src/main.rs"

[features]
# Portable Linux releases embed OpenSSL to avoid a runtime libssl dependency.
vendored-openssl = ["native-tls/vendored"]

[dependencies]
anyhow = "1.0"
directories = "6.0"
futures-util = "0.3"
native-tls = "0.2"
postgres-native-tls = "0.5"
ratatui = "0.30"
ratatui-textarea = "0.9"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7.18"
toml = "0.9"
tree-sitter-highlight = "0.25"
tree-sitter-sequel = "0.3.11"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.0"

[profile.release]
lto = "thin"
strip = true
